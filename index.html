<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>mechanical engineering</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #f2f2f2; 
            color: #000;
            font-family: "Times New Roman", Times, serif;
            padding: 5vw;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        .bg-pylon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover; 
            filter: grayscale(100%) contrast(110%); 
            opacity: 0.2;
            z-index: -1; 
            pointer-events: none;
        }

        section {
            margin-bottom: 100px;
        }

        h1 {
            font-size: 3.5rem;
            letter-spacing: -1px;
            font-weight: bold;
            margin: 0 0 100px 0;
            text-transform: lowercase;
        }

        h2 {
            font-size: 1.5rem;
            margin: 0 0 20px 0;
            text-transform: lowercase;
            font-weight: normal;
        }

        nav {
            display: flex;
            flex-direction: column;
        }

        a {
            color: #000;
            text-decoration: none;
            font-size: 1.5rem;
        }

        nav a {
            display: block; 
            width: 100vw;
            margin-left: -5vw;
            padding: 10px 5vw;
        }

        nav a:hover {
            background-color: #000;
            color: #f2f2f2;
        }

        .release-box {
            display: block;
            width: 100vw;
            margin-left: -5vw;
            padding: 20px 5vw;
        }

        .release-box img {
            display: block;
            margin-bottom: 10px;
        }

        .release-box p {
            font-size: 1.5rem;
            margin: 0;
        }

        .release-box:hover {
            background-color: #000;
            color: #f2f2f2;
        }

        .contact-info {
            margin-top: auto;
            font-size: 1.5rem;
        }

    </style>
</head>
<body>

    <img src="img/pylon.jpeg" class="bg-pylon" alt="">

    <h1>mechanical engineering</h1>
    
    <section>
        <h2>releases</h2>
        <a href="https://bandcamp.com/" class="release-box">
            <img src="img/uno.jpeg" alt="cover" width="315">
            <p>intervention</p>
        </a>
    </section>

    <section>
        <nav>
            <a href="#">instagram</a>
            <a href="#">bandcamp</a>
            <a href="#">youtube</a>
        </nav>
    </section>

    <p class="contact-info">booking & inquiries - mgmt@mechengnoise.co.uk</p>

</body>
</html>
